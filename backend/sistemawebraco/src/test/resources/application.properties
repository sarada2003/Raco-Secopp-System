# Configuracion exclusiva para el classpath de pruebas (./gradlew test).
#
# Gradle/Maven agregan src/test/resources al classpath SOLO de la tarea "test" (y de
# cualquier ejecucion de test desde el IDE). El jar de produccion (bootJar) y la tarea
# bootRun usan unicamente src/main/resources/application.properties — este archivo
# nunca se empaqueta ni se carga fuera de un test run. Por eso es seguro fijar aqui
# una base H2 en memoria y secretos dummy en vez de leerlos de variables de entorno.
#
# H2 en memoria: cada test run arranca con un esquema limpio (create-drop) y no
# depende de tener Postgres corriendo localmente.
spring.datasource.url=jdbc:h2:mem:raco_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT: secreto dummy (>=64 bytes, requerido por HS512) solo para pruebas.
jwt.secret=test-secret-key-solo-para-pruebas-nunca-usar-en-produccion-1234567890
jwt.expiration=86400000

# OpenAI: valor dummy — ningun test del suite por defecto llama a la API real.
spring.ai.openai.api-key=test-key-dummy
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o-mini

# SECOP: valor dummy — SecopServiceTest reemplaza el WebClient real por un stub.
secop.api.base-url=https://www.datos.gov.co
secop.api.resource-path=/resource/p6dx-8zbt.json
secop.api.app-token=test-token-dummy

# Mail: sin credenciales, igual que en dev — el envio simplemente falla y queda logueado.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notificaciones.mail.from=no-reply@raco.com

# Scheduler: "-" es el valor sentinela de Spring para "@Scheduled deshabilitado".
# Evita que NotificacionScheduler dispare durante los tests de contexto completo.
notificaciones.scheduler.cron=-

# Actuator/metrics (rendimiento) — igual que en main, para que el context test lo cubra.
management.endpoints.web.exposure.include=health,metrics

server.tomcat.connection-timeout=120000
spring.mvc.async.request-timeout=100000
spring.jackson.deserialization.fail-on-unknown-properties=false
